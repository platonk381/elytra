# Builds Elytra.exe and Elytra-Setup.exe on GitHub's Windows machines and publishes a release
# whenever VERSION in launcher.py is new. Every Elytra then offers the update by itself.
name: Build & release

on:
  push:
    branches: [main]
    paths: ["launcher.py", "packbuilder.py", "ui/**", "icon.ico", "installer.iss", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path launcher.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT } else { "skip=false" >> $env:GITHUB_OUTPUT }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.v.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Build Elytra
        if: steps.v.outputs.skip == 'false'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install pywebview minecraft-launcher-lib requests
          # PyInstaller with its launcher compiled here instead of the prebuilt one that antivirus
          # heuristics often flag (a well-known false positive). Falls back to the normal package.
          python -m pip download pyinstaller --no-binary pyinstaller --no-deps -d pyi_src
          $tar = Get-ChildItem pyi_src\*.tar.gz | Select-Object -First 1
          tar -xzf $tar.FullName -C pyi_src
          $dir = Get-ChildItem pyi_src -Directory | Select-Object -First 1
          Push-Location "$($dir.FullName)\bootloader"
          python ./waf all --target-arch=64bit
          $ok = $LASTEXITCODE
          Pop-Location
          if ($ok -eq 0) { Write-Host "Bootloader compiled from source"; python -m pip install "$($dir.FullName)" }
          else { Write-Host "Bootloader build failed, using the prebuilt one"; python -m pip install pyinstaller }
          $common = @("--noconfirm", "--windowed", "--name", "Elytra", "--icon", "icon.ico", "--add-data", "ui;ui", "--add-data", "icon.ico;.", "--noupx")
          # folder build for the installer
          python -m PyInstaller @common --onedir --distpath build_dir --workpath build_onedir launcher.py
          # single-file build for the portable download
          python -m PyInstaller @common --onefile --distpath dist --workpath build_onefile launcher.py

      - name: Build installer
        if: steps.v.outputs.skip == 'false'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVer=${{ steps.v.outputs.version }}" installer.iss

      - name: Publish release
        if: steps.v.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $notes = if (Test-Path RELEASE_NOTES.md) { Get-Content RELEASE_NOTES.md -Raw } else { "Elytra $v" }
          $notes += "`n`n**Elytra-Setup.exe** — installer with shortcuts (recommended). **Elytra.exe** — portable, no install."
          gh release create "v$v" dist/Elytra-Setup.exe dist/Elytra.exe --title "Elytra $v" --notes "$notes"

      - name: Publish latest.json (fallback for the in-app update check)
        if: steps.v.outputs.skip == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $notes = if (Test-Path RELEASE_NOTES.md) { Get-Content RELEASE_NOTES.md -Raw } else { "Elytra $v" }
          $assets = @()
          foreach ($n in @("Elytra-Setup.exe", "Elytra.exe")) {
            $f = Get-Item "dist/$n"
            $assets += [ordered]@{ name = $n; size = $f.Length
              digest = "sha256:" + (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
              browser_download_url = "https://github.com/${{ github.repository }}/releases/download/v$v/$n" }
          }
          $obj = [ordered]@{ tag_name = "v$v"; body = $notes; assets = $assets }
          $obj | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM docs/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git commit -m "latest.json for v$v"
          git pull --rebase origin main
          git push origin HEAD:main
