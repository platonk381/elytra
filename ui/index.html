<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elytra</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash">
  <div id="spDots"></div>
  <div class="sp-box">
    <div class="sp-logo"><div class="sp-ring r2"></div><div class="sp-ring"></div><div class="sp-core"><svg class="wings" viewBox="0 0 64 64"><use href="#i-wings"/></svg></div></div>
    <div class="sp-title"><span style="--i:0">E</span><span style="--i:1">l</span><span style="--i:2">y</span><span style="--i:3">t</span><span style="--i:4">r</span><span style="--i:5">a</span></div>
    <div class="sp-sub" id="spSub"><span>…</span></div>
    <div class="sp-bar"><i></i></div>
  </div>
</div>
<div id="aurora"><i></i><i></i><i></i><i></i></div>
<div id="app">
  <nav id="rail">
    <div class="logo"><svg class="wings" viewBox="0 0 64 64"><use href="#i-wings"/></svg></div>
    <button class="nav" data-page="home"><svg class="i"><use href="#i-home"/></svg><span class="tip" data-t="nav.home"></span></button>
    <button class="nav" data-page="browse"><svg class="i"><use href="#i-compass"/></svg><span class="tip" data-t="nav.browse"></span></button>
    <button class="nav" data-page="library"><svg class="i"><use href="#i-grid"/></svg><span class="tip" data-t="nav.library"></span></button>
    <button class="nav" data-page="servers"><svg class="i"><use href="#i-server"/></svg><span class="tip" data-t="nav.servers"></span></button>
    <button class="nav" data-page="skin"><svg class="i"><use href="#i-user"/></svg><span class="tip" data-t="nav.skin"></span></button>
    <button class="nav" data-page="ach"><svg class="i"><use href="#i-trophy"/></svg><span class="tip" data-t="nav.ach"></span></button>
    <div class="rail-sep"></div>
    <div id="railInst"></div>
    <button class="nav" onclick="openCreate()"><svg class="i"><use href="#i-plus"/></svg><span class="tip" data-t="nav.new"></span></button>
    <div class="spacer"></div>
    <button class="nav" id="navToggle" onclick="toggleNavWide()"><svg class="i"><use href="#i-sidebar"/></svg><span class="tip"></span></button>
    <button class="nav" data-page="settings"><svg class="i"><use href="#i-sliders"/></svg><span class="tip" data-t="nav.settings"></span></button>
  </nav>
  <header id="top">
    <div id="crumb"></div>
    <div class="spacer"></div>
    <button class="chip palbtn" onclick="openPalette()"><svg class="i"><use href="#i-search"/></svg><span data-t="pal.hint"></span><kbd>Ctrl K</kbd></button>
    <div id="frBtn"></div>
    <div id="strBtn"></div>
    <div id="runChip"></div>
    <div class="chip" style="cursor:pointer" onclick="go('settings')"><span class="avatar face" id="avatar" style="--s:32px"></span><span id="nickLabel"></span></div>
  </header>
  <main id="main"></main>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div>
<div id="tasks"></div>
<div id="pal" onclick="if(event.target===this)closePalette()"><div class="palbox"><div class="search"><svg class="i"><use href="#i-search"/></svg><input class="input" id="palIn" oninput="buildPalette(this.value)" autocomplete="off"></div><div id="palList"></div></div></div>
<div id="onb"></div>
<div id="drop"><div><svg class='i'><use href='#i-upload'/></svg><b data-t="drop.title"></b><span data-t="drop.sub"></span></div></div>
